name: Windows test installers
on:
  workflow_dispatch:
  push:
    branches: [main, 'build/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: windows-installers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'
      - name: Core tests and full native Windows publish
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./tests/Packaging.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Packaging checks failed.' }
          ./scripts/build-windows.ps1
      - name: Validate native startup before packaging
        shell: pwsh
        run: |
          $env:ZHELI_STARTUP_DIAGNOSTICS = Join-Path $PWD 'artifacts/logs'
          $started = Get-Date
          $root = Join-Path $PWD 'artifacts/win-x64'
          $app = Join-Path $root 'Zheli.Settings/Zheli.Settings.exe'
          try {
            $process = Start-Process $app -WorkingDirectory (Split-Path $app) -PassThru
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 250
              $process.Refresh()
              if ($process.HasExited) { throw "Settings startup failed: $($process.ExitCode)" }
            } while ($process.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)
            if ($process.MainWindowHandle -eq 0) { throw 'Settings window did not appear.' }
            Start-Sleep -Seconds 3
            $process.Refresh()
            if ($process.HasExited) { throw 'Settings exited after creating a window.' }
          } finally {
            Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -and $_.Path.StartsWith($root + '\', [StringComparison]::OrdinalIgnoreCase) } | Stop-Process -Force -ErrorAction SilentlyContinue
            Get-ChildItem artifacts/logs -Filter 'startup-*.txt' | ForEach-Object { Get-Content $_.FullName | Write-Host }
            Get-WinEvent -FilterHashtable @{ LogName='Application'; StartTime=$started } -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -in @('.NET Runtime','Application Error','Windows Error Reporting') } | Select-Object ProviderName,Id,Message | Format-List | Out-String | Write-Host
            Remove-Item Env:\ZHELI_STARTUP_DIAGNOSTICS -ErrorAction SilentlyContinue
          }
      - name: Install checksum-pinned installer compiler
        shell: pwsh
        run: ./scripts/install-inno-compiler.ps1
      - name: Build three independent installers
        shell: pwsh
        run: ./scripts/build-installers.ps1
      - name: Verify installation, startup, coexistence and data preservation
        shell: pwsh
        run: |
          $directory = @(Get-ChildItem artifacts -Directory -Filter 'installers-*')
          if ($directory.Count -ne 1) { throw 'Expected exactly one installer build.' }
          ./scripts/test-installers-windows.ps1 -InstallerDirectory $directory[0].FullName
      - name: Upload tested unsigned installers
        uses: actions/upload-artifact@v4
        with:
          name: Zheli-Windows-x64-Test-Installers
          path: artifacts/installers-*/
          if-no-files-found: error
          retention-days: 14
      - name: Upload build and installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zheli-Windows-Diagnostics
          path: artifacts/logs/
          if-no-files-found: warn
          retention-days: 14
